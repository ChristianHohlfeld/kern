name: CI

# One pipeline: the site is built once and published as soon as it is built;
# native and browser tests run in parallel and do not hold the deployment up.
#   native  unit tests with ASan / UBSan
#   build   Kern Studio + example games (parallel ThinLTO, object cache kept between runs)
#   e2e     the browser test against the built Studio
#   deploy  main only: publishes the site to the gh-pages branch
#           https://christianhohlfeld.github.io/kern/
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a pull request makes its older run moot; on main every push runs to the end, so
# every green main state is published (a run takes ~17 min and main gets pushes more often).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native unit tests (ASan/UBSan)
        run: CXX=g++ CC=gcc kern/tests/run.sh

  # Bit-identical everywhere (docs/lehrer.md, determinism): the Lehrer built with Apple clang on
  # ARM must step the duck exactly as GCC on x86 and WebAssembly do (the golden hashes).
  determinism:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lehrer (Apple clang, arm64)
        run: KERN_NATIVE=1 kern/tools/lehrer.sh build-mac
      - name: Same hashes as x86 and wasm
        run: build-mac/kern_lehrer --fingerprint 400 | diff - kern/tests/determinism_fingerprint.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KERN_OBJ_CACHE: /home/runner/kern-obj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wasi-sdk 25 (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/wasi-sdk
          key: wasi-sdk-25.0
      - name: Install wasi-sdk 25
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/wasi-sdk
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz -C /home/runner/wasi-sdk --strip-components=1
      - name: Object cache
        uses: actions/cache@v4
        with:
          path: /home/runner/kern-obj
          key: kern-obj-${{ github.sha }}
          restore-keys: kern-obj-
      - name: Build Kern Studio and the example games
        run: |
          set -euo pipefail
          export WASI_SDK=/home/runner/wasi-sdk
          tools/build_studio.sh
          kern/build.sh --app kern/examples/hello/hello.wasm kern/examples/hello/hello.cpp
          kern/build.sh --app kern/examples/orbrun/orbrun.wasm kern/examples/orbrun/orbrun.cpp
          kern/build.sh --lehrer generated/kern_lehrer.wasm
          for f in kern/web/kern.mjs kern/web/app.mjs kern/web/studio/*.mjs kern/web/lehrer/*.mjs tools/net_relay.mjs; do node --check "$f"; done
          python3 -I tools/kern_notices.py --check
      - name: Lehrer in WebAssembly (one PPO iteration through the workers' C ABI)
        run: node kern/tests/lehrer_wasm_test.mjs generated/kern_lehrer.wasm
      - name: Logic JIT (graphs compiled to WebAssembly must match the interpreter)
        run: |
          set -euo pipefail
          export WASI_SDK=/home/runner/wasi-sdk
          kern/build.sh /tmp/logic_test.wasm kern/tests/logic_wasm_test.cpp -Ikern/tests
          node kern/tests/logic_wasm_test.mjs /tmp/logic_test.wasm
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/editor _site/generated _site/kern/web/studio _site/kern/examples
          # The landing page, Impressum and Datenschutz; self-hosted fonts when site/fonts exists.
          cp site/*.html _site/
          if [ -d site/fonts ]; then cp -r site/fonts _site/; fi
          cp LICENSE _site/LICENSE.txt && cp kern/LICENSES.md _site/LICENSES.txt
          if [ -f LICENSING.md ]; then cp LICENSING.md _site/LICENSING.txt; fi
          # The editor as an installable app: build SHA as the page's first comment, build.json for
          # the update check, the manifest, the service worker and the icons (site/editor).
          { echo "<!--BUILD_SHA:${GITHUB_SHA}-->"; cat generated/studio.html; } > _site/editor/index.html
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > _site/editor/build.json
          cp -r site/editor/. _site/editor/
          # The Micro Duck's policy set (Apache-2.0): the editor loads the moves it needs from here.
          mkdir -p _site/editor/microduck && cp kern/third_party/microduck/*.onnx _site/editor/microduck/
          # Kern's own trained networks (docs/lehrer.md): the jump.
          mkdir -p _site/editor/policies && cp kern/policies/*.onnx _site/editor/policies/
          cp generated/kern_studio.wasm _site/generated/
          # The Lehrer (docs/lehrer.md): its page, workers and module.
          mkdir -p _site/lehrer _site/kern/web/lehrer
          cp kern/web/lehrer/index.html _site/lehrer/
          cp kern/web/lehrer/*.mjs _site/kern/web/lehrer/
          cp generated/kern_lehrer.wasm _site/generated/
          # Its old address (/train/) leads there.
          mkdir -p _site/train && printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../lehrer/"><a href="../lehrer/">Kern Lehrer</a>\n' > _site/train/index.html
          cp kern/web/kern.mjs kern/web/app.mjs _site/kern/web/
          cp kern/web/studio/*.mjs kern/web/studio/*.html kern/web/studio/*.css _site/kern/web/studio/
          for g in hello orbrun; do
            mkdir -p _site/kern/examples/$g
            cp kern/examples/$g/index.html kern/examples/$g/$g.wasm _site/kern/examples/$g/
          done
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false  # a running publish finishes; only the newest waiting one follows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Playwright (cached)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/e2e
            ~/.cache/ms-playwright
          key: playwright-1.56.0
      - name: Browser end-to-end test
        run: |
          set -euo pipefail
          mkdir -p generated && cp _site/editor/index.html generated/studio.html && cp _site/generated/kern_studio.wasm generated/
          # the app files next to the page, as deployed (manifest, icons, service worker)
          cp -r _site/editor/manifest.webmanifest _site/editor/sw.js _site/editor/build.json _site/editor/icons _site/editor/microduck generated/
          [ -d /tmp/e2e/node_modules/playwright ] || npm install --prefix /tmp/e2e --no-audit --no-fund playwright@1.56.0
          /tmp/e2e/node_modules/.bin/playwright install --with-deps chromium || { echo "::error::playwright install failed"; exit 1; }
          python3 -m http.server 8771 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          mkdir -p artifacts/e2e
          NODE_PATH=/tmp/e2e/node_modules node kern/tests/e2e/studio_e2e.mjs http://127.0.0.1:8771
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: artifacts/e2e/
          if-no-files-found: ignore
