name: Pages

# Builds the engine modules and publishes the live site to GitHub Pages:
#   /                              landing page (site/index.html)
#   /editor/                       Kern Studio (single file, opens Orb Run)
#   /kern/web/studio/              Kern Studio (module build)
#   /kern/web/studio/play.html     built-in levels without the editor (?level=orbRun|physicsLab)
#   /kern/examples/*/              hello, orbrun (C++ games)
# Live: https://christianhohlfeld.github.io/kern/
on:
  push:
    branches: [main]
  workflow_dispatch:

# Published as the gh-pages branch: GitHub enables Pages for a repository on
# its own when that branch appears (served over HTTPS).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk 25
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz -C /tmp
          echo "WASI_SDK=/tmp/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build Kern Studio and the example games
        run: |
          set -euo pipefail
          tools/build_studio.sh
          kern/build.sh --app kern/examples/hello/hello.wasm kern/examples/hello/hello.cpp
          kern/build.sh --app kern/examples/orbrun/orbrun.wasm kern/examples/orbrun/orbrun.cpp
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/editor _site/generated _site/kern/web/studio _site/kern/examples
          cp site/index.html _site/
          cp generated/studio.html _site/editor/index.html
          cp generated/kern_studio.wasm _site/generated/
          cp kern/web/kern.mjs kern/web/app.mjs _site/kern/web/
          cp kern/web/studio/*.mjs kern/web/studio/*.html kern/web/studio/*.css _site/kern/web/studio/
          for g in hello orbrun; do
            mkdir -p _site/kern/examples/$g
            cp kern/examples/$g/index.html kern/examples/$g/$g.wasm _site/kern/examples/$g/
          done
          touch _site/.nojekyll
          du -sh _site
      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
