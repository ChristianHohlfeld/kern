<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kern scene game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1018; color: #e8eef6; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #status { position: fixed; left: 12px; top: 10px; padding: 6px 10px; background: rgba(0,0,0,.5); border-radius: 6px; pointer-events: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; opacity: .6; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="status">loading...</div>
<div id="hint">WASD / arrows move · Space jump · R restart · P pause · drag to orbit · open any .e3d with ?file=level.e3d or drop it here</div>
<script type="module">
  // The C++ game (scenegame.cpp) reads the level from the launch parameter "scene".
  import {runKernApp} from "../../web/app.mjs";
  const status = document.getElementById("status"), canvas = document.getElementById("game");
  let app = null;
  async function start(sceneText) {
    app?.stop?.();
    const args = sceneText ? "scene=" + encodeURIComponent(sceneText) : "";
    app = await runKernApp({canvas, url: "./scenegame.wasm", args, onStatus: text => (status.textContent = text)});
    window.__kernApp = app;
    canvas.focus();
  }
  const file = new URLSearchParams(location.search).get("file");
  start(file ? await (await fetch(file)).text() : null).catch(error => { status.textContent = String(error); window.__kernError = String(error); });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", async e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f) start(await f.text()).catch(error => (status.textContent = String(error)));
  });
</script>
</body>
</html>
